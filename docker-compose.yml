services:
  # ==================== Milvus 依赖 ====================
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: secondbrain-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data_v26:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - secondbrain-net

  minio:
    # minio/minio is no longer pulled from Docker Hub; Milvus ships its own mirror
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: secondbrain-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data_v26:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - secondbrain-net

  # ==================== Milvus Standalone ====================
  # v2.6: built-in BM25 Function + jieba analyzer. Settings follow the official
  # v2.6.25 standalone compose. Volumes are new (*_v26): 2.4 data is not migrated.
  milvus:
    image: milvusdb/milvus:v2.6.25
    container_name: secondbrain-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - milvus_data_v26:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - secondbrain-net

  # ==================== Backend (FastAPI) ====================
  backend:
    profiles: ["backend"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secondbrain-backend
    env_file:
      - ./backend/.env
    ports:
      # 低位端口在部分 Docker Desktop+WSL2 上会出现 expose 500；高位通常可用
      - "18080:8000"
    volumes:
      - ./backend/data:/app/data              # SQLite 持久化
      - ./backend/app:/app/app              # 开发时热重载代码映射
      - ./backend/evaluation:/app/evaluation  # 评估脚本映射
      - ./backend/models:/app/models        # Embedding + Reranker 模型
    depends_on:
      milvus:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - secondbrain-net

volumes:
  etcd_data_v26:
  minio_data_v26:
  milvus_data_v26:

networks:
  secondbrain-net:
    driver: bridge
